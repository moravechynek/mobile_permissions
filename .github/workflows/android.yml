name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      # Builds the web app into dist/ and copies it plus plugin config into the Android project.
      - run: npm run android:sync
      # Both flavors: standard and "queryAll" (QUERY_ALL_PACKAGES).
      - run: ./gradlew assembleStandardDebug assembleQueryAllDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: permission-explorer-debug-apk
          path: |
            android/app/build/outputs/apk/standard/debug/app-standard-debug.apk
            android/app/build/outputs/apk/queryAll/debug/app-queryAll-debug.apk
