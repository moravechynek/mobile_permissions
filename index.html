<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6feb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Permission Explorer</title>
  </head>
  <body>
    <header>
      <h1>Permission Explorer</h1>
      <div id="env" class="env"></div>
    </header>
    <main>
      <section class="group">
        <h2>Funguje bez ptaní</h2>
        <p class="group-note">Tohle aplikace dostane bez jakéhokoli dialogu – uživatel se o tom nedozví.</p>
        <div id="free" class="cards"></div>
      </section>
      <section class="group">
        <h2>Ptá se uživatele</h2>
        <p class="group-note">Systémový dialog nebo ruční zapnutí v Nastavení – uživatel o přístupu ví a může ho odmítnout.</p>
        <div id="asks" class="cards"></div>
      </section>
    </main>
    <footer>
      <button id="install" hidden>Nainstalovat jako PWA</button>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
